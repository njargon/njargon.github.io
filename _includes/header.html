<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ "/" | relative_url }}">{{ site.title | escape }}</a>
    {%- if site.header_description -%}
      <p class="header-description">{{ site.header_description }}</p>
    {%- endif -%}
  </div>
</header>
